<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1B29"/>
      <stop offset="55%" stop-color="#1A1519"/>
      <stop offset="100%" stop-color="#2A1D29"/>
    </linearGradient>
    <linearGradient id="goldRose" x1="96" y1="88" x2="416" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2CBD8"/>
      <stop offset="50%" stop-color="#E8C58E"/>
      <stop offset="100%" stop-color="#E584A4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#E584A4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1A1519" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Inner Haute-Parfumerie Frame -->
  <rect x="44" y="44" width="424" height="424" rx="82" stroke="url(#goldRose)" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="58" y="58" width="396" height="396" rx="70" stroke="#F5EFF3" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Subtle Perfume Drop Emblem -->
  <path d="M256 108C256 108 232 140 232 158C232 171.255 242.745 182 256 182C269.255 182 280 171.255 280 158C280 140 256 108 256 108Z" stroke="url(#goldRose)" stroke-width="4" fill="#E8C58E" fill-opacity="0.16"/>

  <!-- Editorial S Monogram -->
  <text x="256" y="328" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="184" font-weight="600" fill="url(#goldRose)" letter-spacing="-4">S</text>

  <!-- Subtle Brand Name -->
  <text x="256" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#F5EFF3" fill-opacity="0.9" letter-spacing="4">Atelier</text>
</svg>
